<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2>게시글 상세</h2>

    <div class="mb-3">
        <label>번호</label>
        <div class="form-control" th:text="${board.id}">1</div>
    </div>

    <div class="mb-3">
        <label>제목</label>
        <div class="form-control" th:text="${board.title}">제목</div>
    </div>

    <div class="mb-3">
        <label>작성자</label>
        <div class="form-control" th:text="${board.writer}">작성자</div>
    </div>

    <div class="mb-3">
        <label>내용</label>
        <div class="form-control" style="height:150px;" th:text="${board.content}">내용</div>
    </div>

    <a href="/boards" th:href="@{/board}" class="btn btn-secondary">목록</a>
    <a href="/boards/1/edit" th:href="@{/board/{id}/edit(id=${board.id})}" class="btn btn-warning">수정</a>
    <form th:action="@{/board/{id}/delete(id=${board.id})}" method="post">
        <button type="submit" class="btn btn-danger">삭제</button>
    </form>

</div>

</body>
</html>
