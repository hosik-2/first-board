<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>게시글 작성</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .container {
      max-width: 560px;
    }
  </style>
</head>
<body>

<div class="container mt-4">

  <h2>게시글 작성</h2>

  <form action="/board" th:action="${board.id} != null
    ? @{/board/{id}/edit(id=${board.id})}
    : @{/board/add}" method="post" th:object="${board}">

    <input type="hidden" name="id" th:value="${board.id}">

    <div class="mb-3">
      <label>제목</label>
      <input type="text" class="form-control" th:field="*{title}" th:errorclass="is-invalid">
      <div class="invalid-feedback" th:errors="*{title}">
        제목 오류
      </div>
    </div>

    <div class="mb-3">
      <label>작성자</label>
      <input type="text" class="form-control" th:field="*{writer}" th:errorclass="is-invalid" readonly>
      <div class="invalid-feedback" th:errors="*{writer}">
        작성자 오류
      </div>
    </div>

    <div class="mb-3">
      <label>내용</label>
      <textarea class="form-control" th:field="*{content}" th:errorclass="is-invalid"></textarea>
      <div class="invalid-feedback" th:errors="*{content}">
        내용 오류
      </div>
    </div>

    <button type="submit" class="btn btn-primary">저장</button>
    <a href="/boards" class="btn btn-secondary" th:href="@{/board}">목록</a>

  </form>

</div>

</body>
</html>
