<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>아이디 찾기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4 bg-white p-5 rounded shadow-sm">
            <h2 class="text-center mb-4">아이디 찾기</h2>

            <div th:if="${foundId}" class="alert alert-success text-center" role="alert">
                찾으시는 아이디는 <br><strong class="fs-4" th:text="${foundId}">ID</strong> 입니다.
                <div class="mt-2 border-top pt-2">
                    <a th:href="@{/login}" class="btn btn-sm btn-success">로그인하러 가기</a>
                </div>
            </div>
            <div th:if="${error}" class="alert alert-danger text-center" role="alert" th:text="${error}">
                오류 메시지
            </div>

            <form th:action="@{/members/find-id}" method="post">
                <div class="mb-3">
                    <label class="form-label">이름</label>
                    <input type="text" name="name" class="form-control" required placeholder="가입 시 이름">
                </div>
                <div class="mb-3">
                    <label class="form-label">이메일</label>
                    <input type="email" name="email" class="form-control" required placeholder="가입 시 이메일">
                </div>
                <div class="mb-3">
                    <label class="form-label">전화번호</label>
                    <input type="text" name="phoneNumber" class="form-control" required placeholder="가입 시 전화번호">
                </div>
                <button type="submit" class="btn btn-info w-100 text-white mb-3">아이디 찾기</button>
                <div class="text-center">
                    <a th:href="@{/login}" class="text-decoration-none small text-muted">로그인 화면으로</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
