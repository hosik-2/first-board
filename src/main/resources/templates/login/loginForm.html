<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5" style="max-width: 400px;">
        <h2 class="text-center mb-4">로그인</h2>
        <form th:action="@{/login}" th:object="${loginForm}" method="post">

            <div th:if="${#fields.hasGlobalErrors()}">
                <p class="text-danger" th:each="err : ${#fields.globalErrors()}" th:text="${err}">오류 메시지</p>
            </div>

            <div class="mb-3">
                <label>로그인 ID</label>
                <input type="text" th:field="*{loginId}" class="form-control" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{loginId}">아이디 오류</div>
            </div>
            <div class="mb-3">
                <label>비밀번호</label>
                <input type="password" th:field="*{password}" class="form-control" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{password}">비밀번호 오류</div>
            </div>
            <button type="submit" class="btn btn-primary w-100">로그인</button>
        </form>
    </div>
</body>
</html>
