<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>First Board</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5 text-center">
    <h1>First Board 프로젝트</h1>
    <hr>

    <div th:if="${session.loginMember == null}" class="row justify-content-center">
        <div class="col-auto">
            <a class="btn btn-primary btn-lg" th:href="@{/login}">로그인</a>
        </div>
        <div class="col-auto">
            <a class="btn btn-secondary btn-lg" th:href="@{/members/add}">회원 가입</a>
        </div>
    </div>

    <div th:if="${session.loginMember != null}">
        <h2 th:text="|${session.loginMember.name}님 환영합니다!|">사용자 이름</h2>
        <div class="mt-4">
            <a class="btn btn-info btn-lg" th:href="@{/board}">게시판 입장</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-danger btn-lg" type="submit">로그아웃</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
