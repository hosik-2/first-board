<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>게시글 작성</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

  <h2>게시글 작성</h2>

  <form action="/board" th:action="${board.id} != null
    ? @{/board/{id}/edit(id=${board.id})}
    : @{/board/add}" method="post">

    <input type="hidden" name="id" th:value="${board.id}">

    <div class="mb-3">
      <label>제목</label>
      <input type="text" name="title" class="form-control" th:value="${board.title}" >
    </div>

    <div class="mb-3">
      <label>작성자</label>
      <input type="text" name="writer" class="form-control" th:value="${board.writer}">
    </div>

    <div class="mb-3">
      <label>내용</label>
      <textarea name="content" class="form-control" th:text="${board.content}"></textarea>
    </div>

    <button type="submit" class="btn btn-primary">저장</button>
    <a href="/boards" class="btn btn-secondary" th:href="@{/board}">목록</a>

  </form>

</div>

</body>
</html>
