<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 가입</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4 bg-white p-5 rounded shadow-sm">
            <h2 class="text-center mb-4">회원 가입</h2>
            <form th:action="@{/members/add}" th:object="${member}" method="post">
                <div class="mb-3">
                    <label th:for="name" class="form-label">이름</label>
                    <input type="text" th:field="*{name}" class="form-control" th:errorclass="is-invalid" placeholder="이름을 입력하세요">
                    <div class="invalid-feedback" th:errors="*{name}">이름 오류</div>
                </div>
                <div class="mb-3">
                    <label th:for="loginId" class="form-label">로그인 ID</label>
                    <input type="text" th:field="*{loginId}" class="form-control" th:errorclass="is-invalid" placeholder="아이디를 입력하세요">
                    <div class="invalid-feedback" th:errors="*{loginId}">아이디 오류</div>
                </div>
                <div class="mb-3">
                    <label th:for="password" class="form-label">비밀번호</label>
                    <input type="password" th:field="*{password}" class="form-control" th:errorclass="is-invalid" placeholder="비밀번호를 입력하세요">
                    <div class="invalid-feedback" th:errors="*{password}">비밀번호 오류</div>
                </div>
                <div class="mb-3">
                    <label th:for="email" class="form-label">이메일</label>
                    <input type="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid" placeholder="example@email.com">
                    <div class="invalid-feedback" th:errors="*{email}">이메일 오류</div>
                </div>
                <div class="mb-3">
                    <label th:for="phoneNumber" class="form-label">전화번호</label>
                    <input type="text" th:field="*{phoneNumber}" class="form-control" th:errorclass="is-invalid" placeholder="010-0000-0000">
                    <div class="invalid-feedback" th:errors="*{phoneNumber}">전화번호 오류</div>
                </div>
                <hr class="my-4">
                <button type="submit" class="btn btn-primary w-100 mb-2">가입하기</button>
                <button type="button" class="btn btn-outline-secondary w-100" th:onclick="|location.href='@{/}'|">취소</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
