<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 찾기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4 bg-white p-5 rounded shadow-sm">
            <h2 class="text-center mb-4">비밀번호 찾기</h2>

            <div th:if="${message}" class="alert alert-info text-center" role="alert" th:text="${message}">
                성공 메시지
            </div>
            <div th:if="${error}" class="alert alert-danger text-center" role="alert" th:text="${error}">
                오류 메시지
            </div>

            <form th:action="@{/members/find-pw}" method="post">
                <div class="mb-3">
                    <label class="form-label">로그인 ID</label>
                    <input type="text" name="loginId" class="form-control" required placeholder="아이디 입력">
                </div>
                <div class="mb-3">
                    <label class="form-label">이름</label>
                    <input type="text" name="name" class="form-control" required placeholder="이름 입력">
                </div>
                <div class="mb-3">
                    <label class="form-label">이메일</label>
                    <input type="email" name="email" class="form-control" required placeholder="이메일 입력">
                </div>
                <div class="mb-3">
                    <label class="form-label">전화번호</label>
                    <input type="text" name="phoneNumber" class="form-control" required placeholder="전화번호 입력">
                </div>
                <button type="submit" class="btn btn-warning w-100 mb-3">비밀번호 재발급</button>
                <div class="text-center">
                    <a th:href="@{/login}" class="text-decoration-none small text-muted">로그인 화면으로</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
