<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시판 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2>게시판</h2>

    <a href="/boards/new" th:href="@{/board/edit}" class="btn btn-primary mb-3">글 작성</a>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성자</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="board : ${list}">
            <td th:text="${board.id}">1</td>
            <td><a href="/boards/1" th:href="@{/board/{boardId}(boardId=${board.id})}" th:text="${board.title}">첫 게시글</a></td>
            <td th:text="${board.writer}">작성자</td>
        </tr>
        </tbody>

    </table>

</div>

</body>
</html>
