<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Server Error</title>
    <style>
        body { background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .error-container { text-align: center; background: white; padding: 50px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { color: #9b59b6; font-size: 80px; margin: 0; }
        p { color: #333; font-size: 24px; font-weight: bold; margin: 20px 0; }
        .btn { display: inline-block; padding: 12px 25px; background-color: #9b59b6; color: white; text-decoration: none; border-radius: 10px; }
    </style>
</head>
<body>
<div class="error-container">
    <h1>500</h1>
    <p>서버가 잠시 아파요... 🤒 금방 나아서 돌아올게요!</p>
    <a href="/" class="btn">잠시 후 다시 시도하기</a>
</div>
</body>
</html>
