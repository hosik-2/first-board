<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>404 Not Found</title>
    <style>
        body { background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Pretendard', sans-serif; }
        .error-container { text-align: center; background: white; padding: 50px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { color: #ff4d4d; font-size: 80px; margin: 0; }
        p { color: #333; font-size: 24px; font-weight: bold; margin: 20px 0; }
        .btn { display: inline-block; padding: 12px 25px; background-color: #007bff; color: white; text-decoration: none; border-radius: 10px; transition: 0.3s; }
        .btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>
<div class="error-container">
    <h1>404</h1>
    <p>호석이의 게시판: 길을 잃으셨나요? 🧐</p>
    <a href="/" class="btn">집으로 돌아가기</a>
</div>
</body>
</html>
